# ThixInstall.Cloud - Development (branch dev, image :nightly) with pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:4955
#   pgAdmin: http://localhost:4956   (no sign-in; database password: thixinstall)
name: thixinstall-dev

services:
  web:
    image: ghcr.io/real-ttx/thixinstall:nightly
    restart: unless-stopped
    ports:
      - "4955:4955"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: thixinstall
      POSTGRES_USER: thixinstall
      POSTGRES_PASSWORD: thixinstall
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thixinstall -d thixinstall"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "4956:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@thixinstall.example.com
      PGADMIN_DEFAULT_PASSWORD: thixinstall
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "ThixInstall", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "thixinstall", "Username": "thixinstall", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
