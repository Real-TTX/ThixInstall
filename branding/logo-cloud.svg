<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    ThixInstall.Cloud icon (PWA, 48 px and larger): the box and arrow of the app icon with a cloud badge bottom right,
    so the web app and the desktop app are told apart on a home screen. Maskable: everything important sits inside
    the safe zone (centre circle of 80 %).
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#36C7A8"/>
      <stop offset="1" stop-color="#0B7566"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="url(#tile)"/>
  <path d="M70 140 L90 115 H166 L186 140 Z" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="8" stroke-linejoin="round"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <line x1="128" y1="54" x2="128" y2="128"/>
    <polyline points="97,99 128,130 159,99"/>
  </g>
  <rect x="64" y="136" width="128" height="72" rx="16" fill="#FFFFFF"/>
  <line x1="104" y1="166" x2="150" y2="166" stroke="#13917C" stroke-width="11" stroke-linecap="round"/>
  <path d="M154 210h40a20 20 0 0 0 2-39.9 27 27 0 0 0-51.8 6A17 17 0 0 0 154 210z" fill="#0A4F45" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
</svg>
